<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkIT — Analytics Dashboard</title>
  <!-- Load Apache ECharts from CDN with unpkg fallback -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script>if (typeof echarts === "undefined") { document.write('<script src="https://unpkg.com/echarts@5.5.0/dist/echarts.min.js"><\/script>'); }</script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #090d0b; color: #f0fdf4; padding: 24px; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { font-size: 24px; color: #10b981; }
    .badge { background: #15221b; padding: 6px 14px; border-radius: 20px; font-size: 14px; color: #34d399; border: 1px solid rgba(16, 185, 129, 0.25); font-family: monospace; font-weight: bold; }
    
    /* KPI Cards Grid */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: #0f1713; border: 1px solid rgba(16, 185, 129, 0.18); border-radius: 12px; padding: 20px; }
    .card-title { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
    .card-value { font-size: 28px; font-weight: bold; margin-top: 8px; color: #f0fdf4; }
    
    /* Charts Grid */
    .chart-container { background: #0f1713; border: 1px solid rgba(16, 185, 129, 0.18); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
    .chart-header { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: #f0fdf4; display: flex; align-items: center; gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
    
    /* ML Insights Banner */
    .ml-box { background: linear-gradient(135deg, rgba(6, 78, 59, 0.4), rgba(15, 23, 19, 0.9)); border: 1px solid rgba(52, 211, 153, 0.4); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
    .ml-title { font-size: 16px; font-weight: bold; color: #34d399; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .ml-reasons { list-style: none; margin-top: 12px; }
    .ml-reasons li { padding: 4px 0; font-size: 14px; color: #cbd5e1; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>⚡ LinkIT Analytics</h1>
      <p style="color: #94a3b8; font-size: 14px; margin-top: 4px;">Real-Time Telemetry & ML Forecasting</p>
    </div>
    <div class="badge" id="link-code">Loading...</div>
  </header>

  <!-- 1. KPI Cards -->
  <div class="kpi-grid">
    <div class="card">
      <div class="card-title">Total Clicks</div>
      <div class="card-value" id="kpi-clicks">0</div>
    </div>
    <div class="card">
      <div class="card-title">Unique Visitors</div>
      <div class="card-value" id="kpi-visitors" style="color: #10b981;">0</div>
    </div>
    <div class="card">
      <div class="card-title">Average Latency</div>
      <div class="card-value" id="kpi-latency">0 ms</div>
    </div>
    <div class="card">
      <div class="card-title">Bot Traffic</div>
      <div class="card-value" id="kpi-bots">0%</div>
    </div>
  </div>

  <!-- 2. ML Insights Banner -->
  <div class="ml-box" id="ml-section" style="display: none;">
    <div class="ml-title">🧠 ML Traffic Forecast & Insights (Gradient Boosting)</div>
    <p id="ml-summary" style="font-size: 15px; color: #f0fdf4; font-weight: 500;"></p>
    <ul class="ml-reasons" id="ml-reasons-list"></ul>
  </div>

  <!-- 3. Main Time-Series Traffic Chart -->
  <div class="chart-container">
    <div class="chart-header">📈 Traffic Volume Over Time</div>
    <div id="traffic-chart" style="width: 100%; height: 350px;"></div>
  </div>

  <!-- 4. Two-Column Breakdown: Countries & Devices -->
  <div class="grid-2">
    <div class="chart-container">
      <div class="chart-header">🌍 Top Countries</div>
      <div id="country-chart" style="width: 100%; height: 280px;"></div>
    </div>
    <div class="chart-container">
      <div class="chart-header">📱 Device Breakdown</div>
      <div id="device-chart" style="width: 100%; height: 280px;"></div>
    </div>
  </div>
</div>

<script>
  const pathParts = window.location.pathname.split("/").filter(Boolean);
  const shortCode = pathParts.length > 1 ? pathParts[pathParts.length - 1] : "latest";
  document.getElementById("link-code").innerText = "Short Code: /" + shortCode;

  fetch(`/api/analytics/${shortCode}?days=30`)
    .then(res => {
      if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
      return res.json();
    })
    .then(data => {
      const stats = data.stats || {};
      const ml = data.ml;

      const totalClicks = stats.total_clicks || 0;
      const uniqueVisitors = stats.unique_visitors || 0;
      const avgLatency = stats.avg_latency_ms || 0;
      const botClicks = stats.bot_clicks || 0;

      document.getElementById("kpi-clicks").innerText = totalClicks.toLocaleString();
      document.getElementById("kpi-visitors").innerText = uniqueVisitors.toLocaleString();
      document.getElementById("kpi-latency").innerText = avgLatency.toFixed(1) + " ms";
      const botPct = totalClicks > 0 ? ((botClicks / totalClicks) * 100).toFixed(1) : "0.0";
      document.getElementById("kpi-bots").innerText = botPct + "%";

      if (ml) {
        document.getElementById("ml-section").style.display = "block";
        document.getElementById("ml-summary").innerText = ml.plain_english_summary || "Forecast model active.";
        const reasonsList = document.getElementById("ml-reasons-list");
        if (ml.why_breakdown && ml.why_breakdown.reasons_list) {
          reasonsList.innerHTML = ml.why_breakdown.reasons_list.map(r => `<li>${r}</li>`).join("");
        }
      }

      if (typeof echarts === "undefined") {
        console.warn("ECharts library not loaded");
        return;
      }

      // Render 1: Main Traffic Chart
      const timeSeries = stats.time_series || [];
      const times = timeSeries.map(p => p.timestamp);
      const clicks = timeSeries.map(p => p.clicks);
      
      const trafficChart = echarts.init(document.getElementById("traffic-chart"));
      trafficChart.setOption({
        backgroundColor: "transparent",
        tooltip: {
          trigger: "axis",
          backgroundColor: "rgba(15, 23, 19, 0.95)",
          borderColor: "#10b981",
          borderWidth: 1.5,
          textStyle: { color: "#f0fdf4" }
        },
        grid: { left: "3%", right: "3%", bottom: "12%", containLabel: true },
        xAxis: {
          type: "category",
          data: times.length ? times : ["No Events"],
          axisLine: { lineStyle: { color: "rgba(16, 185, 129, 0.25)" } },
          axisLabel: { color: "#cbd5e1", fontSize: 11 }
        },
        yAxis: {
          type: "value",
          splitLine: { lineStyle: { color: "rgba(255, 255, 255, 0.08)" } },
          axisLabel: { color: "#cbd5e1", fontSize: 11 }
        },
        series: [{
          name: "Clicks",
          type: "line",
          smooth: true,
          data: clicks.length ? clicks : [0],
          lineStyle: { color: "#10b981", width: 3 },
          areaStyle: {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: "rgba(16, 185, 129, 0.45)" },
              { offset: 1, color: "rgba(16, 185, 129, 0)" }
            ])
          },
          itemStyle: { color: "#34d399" }
        }],
        dataZoom: [{ type: "inside" }, { type: "slider", bottom: 0, textStyle: { color: "#cbd5e1" }, fillerColor: "rgba(16, 185, 129, 0.25)" }]
      });

      // Render 2: Top Countries Chart (Bar)
      const countries = stats.countries || {};
      const countryChart = echarts.init(document.getElementById("country-chart"));
      countryChart.setOption({
        backgroundColor: "transparent",
        tooltip: {
          trigger: "item",
          backgroundColor: "rgba(15, 23, 19, 0.95)",
          borderColor: "#10b981",
          textStyle: { color: "#f0fdf4" }
        },
        xAxis: {
          type: "value",
          splitLine: { lineStyle: { color: "rgba(255, 255, 255, 0.08)" } },
          axisLabel: { color: "#cbd5e1" }
        },
        yAxis: {
          type: "category",
          data: Object.keys(countries).length ? Object.keys(countries) : ["Direct / Unknown"],
          axisLine: { lineStyle: { color: "rgba(16, 185, 129, 0.2)" } },
          axisLabel: { color: "#f0fdf4", fontWeight: "bold" }
        },
        series: [{
          type: "bar",
          data: Object.values(countries).length ? Object.values(countries) : [0],
          itemStyle: {
            color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
              { offset: 0, color: "#059669" },
              { offset: 1, color: "#34d399" }
            ]),
            borderRadius: [0, 6, 6, 0]
          }
        }]
      });

      // Render 3: Device Breakdown (Doughnut)
      const devices = stats.devices || {};
      const deviceChart = echarts.init(document.getElementById("device-chart"));
      deviceChart.setOption({
        backgroundColor: "transparent",
        tooltip: {
          trigger: "item",
          backgroundColor: "rgba(15, 23, 19, 0.95)",
          borderColor: "#10b981",
          textStyle: { color: "#f0fdf4" }
        },
        legend: { bottom: "0%", textStyle: { color: "#cbd5e1" } },
        color: ["#10b981", "#14b8a6", "#06b6d4", "#3b82f6"],
        series: [{
          type: "pie",
          radius: ["40%", "70%"],
          avoidLabelOverlap: false,
          itemStyle: { borderRadius: 8, borderColor: "#0f1713", borderWidth: 2 },
          data: Object.entries(devices).length ? Object.entries(devices).map(([k, v]) => ({ name: k, value: v })) : [{ name: "Desktop", value: 1 }]
        }]
      });

      window.addEventListener("resize", () => {
        trafficChart.resize();
        countryChart.resize();
        deviceChart.resize();
      });
    })
    .catch(err => {
      console.error("Failed to load analytics:", err);
    });
</script>
</body>
</html>
